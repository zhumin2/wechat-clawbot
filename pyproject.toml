[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-clawbot"
version = "0.1.0"
description = "Python SDK for WeChat ClawBot / iLink protocol (zero-dependency)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "zhumin2" }]
keywords = ["wechat", "clawbot", "ilink", "weixin", "bot", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools]
py-modules = ["wechat_clawbot"]
